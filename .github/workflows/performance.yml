name: Performance probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Measure HTTP, Hibernate SQL and PostgreSQL locks
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify -Pperformance
      - uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: target/performance/report.json
          if-no-files-found: error
          retention-days: 14
