name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with PostgreSQL integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify -Pintegration
      - name: Check browser JavaScript syntax
        run: node --check src/main/resources/static/assets/app.js
      - name: Build and start Docker Compose
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          pwsh -File ./scripts/check-env.ps1
          docker compose up --build -d
      - name: Run portfolio demo against Docker Compose
        shell: pwsh
        run: ./scripts/demo.ps1 -NoSessionFile
      - name: Verify isolated HTTPS deployment and backup restore
        shell: pwsh
        run: ./scripts/check-deployment.ps1
      - name: Show Compose logs on failure
        if: failure()
        env:
          JWT_SECRET: unused-for-log-inspection
        run: docker compose logs --no-color
      - name: Stop Compose services
        if: always()
        env:
          JWT_SECRET: unused-for-container-cleanup
        run: docker compose down
