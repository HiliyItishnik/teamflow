name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with PostgreSQL integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify -Pintegration
      - name: Smoke test Docker Compose
        run: |
          docker compose up --build -d
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose down
