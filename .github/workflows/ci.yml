name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with PostgreSQL integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify -Pintegration
      - name: Smoke test Docker Compose
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          docker compose up --build -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 2 --max-time 5 http://localhost:8080/actuator/health
          auth_response=$(curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"email":"smoke@example.test","displayName":"CI","password":"CI-test-password-123"}' http://localhost:8080/api/v1/auth/register)
          access_token=$(printf '%s' "$auth_response" | jq -er '.accessToken')
          curl --fail --silent --show-error --output /dev/null -H "Authorization: Bearer $access_token" http://localhost:8080/api/v1/auth/me
          workspace_response=$(curl --fail --silent --show-error -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"name":"CI workspace"}' http://localhost:8080/api/v1/workspaces)
          workspace_id=$(printf '%s' "$workspace_response" | jq -er '.id')
          project_response=$(curl --fail --silent --show-error -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"name":"CI project"}' "http://localhost:8080/api/v1/workspaces/$workspace_id/projects")
          project_id=$(printf '%s' "$project_response" | jq -er '.id')
          tasks_url="http://localhost:8080/api/v1/workspaces/$workspace_id/projects/$project_id/tasks"
          task_response=$(curl --fail --silent --show-error -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"title":"CI task","status":"TODO","priority":"HIGH"}' "$tasks_url")
          task_id=$(printf '%s' "$task_response" | jq -er '.id')
          creator_id=$(printf '%s' "$auth_response" | jq -er '.user.id')
          assignment=$(jq -n --arg userId "$creator_id" '{userId:$userId}')
          curl --fail --silent --show-error --output /dev/null -X PUT -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data "$assignment" "$tasks_url/$task_id/assignee"
          curl --fail --silent --show-error --output /dev/null -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"body":"CI comment"}' "$tasks_url/$task_id/comments"
          curl --fail --silent --show-error --output /dev/null -X PUT -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' --data '{"title":"CI task","status":"DONE","priority":"HIGH"}' "$tasks_url/$task_id"
          history=$(curl --fail --silent --show-error -H "Authorization: Bearer $access_token" "$tasks_url/$task_id/history")
          printf '%s' "$history" | jq -e '.totalElements == 2 and .content[1].toStatus == "DONE"' > /dev/null
      - name: Show Compose logs on failure
        if: failure()
        env:
          JWT_SECRET: unused-for-log-inspection
        run: docker compose logs --no-color
      - name: Stop Compose services
        if: always()
        env:
          JWT_SECRET: unused-for-container-cleanup
        run: docker compose down
