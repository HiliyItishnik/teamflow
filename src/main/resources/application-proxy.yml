# Включать только за единственным доверенным reverse proxy.
server:
  forward-headers-strategy: native
  tomcat:
    redirect-context-root: false
    remoteip:
      # Только точный адрес прокси, без доверия ко всем private/loopback сетям.
      internal-proxies: '\Q${TRUSTED_PROXY_ADDRESS}\E'
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port
